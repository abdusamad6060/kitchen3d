<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Конструктор Кухонь — Кухни Исфара</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; background: #181818; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Панель категорий */
        #catalog-tabs {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; gap: 6px; overflow-x: auto; padding-bottom: 5px;
            z-index: 10;
        }
        .tab-btn {
            background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(8px);
            color: #fff; border: 1px solid #444; padding: 8px 14px;
            border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer;
            white-space: nowrap;
        }
        .tab-btn.active { background: #007aff; border-color: #007aff; }

        /* Подкатегории */
        #sub-catalog {
            position: absolute; top: 55px; left: 10px; right: 10px;
            background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(10px);
            border: 1px solid #333; border-radius: 10px; padding: 8px;
            display: flex; gap: 8px; overflow-x: auto; z-index: 10;
        }
        .item-card {
            background: #2a2a2a; border: 1px solid #444; border-radius: 6px;
            padding: 8px 12px; font-size: 11px; cursor: pointer; text-align: center;
            min-width: 100px; white-space: nowrap;
        }
        .item-card b { display: block; color: #34c759; margin-bottom: 2px; }

        /* Панель инструментов справа */
        #right-toolbar {
            position: absolute; right: 10px; bottom: 80px;
            display: flex; flex-direction: column; gap: 8px; z-index: 10;
        }
        .icon-btn {
            background: rgba(30,30,30,0.9); border: 1px solid #444; color: #fff;
            width: 40px; height: 40px; border-radius: 8px; display: flex;
            align-items: center; justify-content: center; font-size: 16px; cursor: pointer;
        }

        /* Панель свойств */
        #properties-panel {
            position: absolute; bottom: 15px; left: 10px; right: 10px;
            background: rgba(24, 24, 24, 0.95); backdrop-filter: blur(12px);
            border: 1px solid #444; border-radius: 12px; padding: 12px;
            display: none; z-index: 10;
        }
        #properties-panel h4 { margin-bottom: 8px; font-size: 13px; color: #34c759; display: flex; justify-content: space-between; }
        .prop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-bottom: 10px; }
        .prop-group { display: flex; flex-direction: column; gap: 2px; }
        .prop-group label { font-size: 10px; color: #aaa; }
        .prop-group input, .prop-group select {
            background: #1a1a1a; border: 1px solid #444; color: #fff;
            padding: 5px; border-radius: 4px; font-size: 12px;
        }
        .btn-action { padding: 8px; border-radius: 6px; border: none; font-weight: bold; font-size: 12px; cursor: pointer; flex: 1; }
        .btn-del { background: #ff3b30; color: #fff; }
        .btn-door { background: #ff9500; color: #000; }

        /* Модальное окно */
        #report-modal {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9);
            display: none; flex-direction: column; padding: 20px; z-index: 100;
        }
        #report-content { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px; flex: 1; overflow-y: auto; margin-bottom: 10px; font-family: monospace; font-size: 11px; }
        .table-spec { width: 100%; border-collapse: collapse; text-align: left; }
        .table-spec th, .table-spec td { border: 1px solid #333; padding: 6px; }
        .table-spec th { background: #222; color: #34c759; }
    </style>
    <!-- Прямое подключение Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <div id="catalog-tabs">
        <button class="tab-btn active" onclick="switchTab('base', this)">🍳 Нижние модули</button>
        <button class="tab-btn" onclick="switchTab('wall', this)">☁️ Верхние шкафы</button>
        <button class="tab-btn" onclick="switchTab('tall', this)">🏛️ Пеналы</button>
        <button class="tab-btn" onclick="switchTab('counter', this)">🪵 Столешницы</button>
    </div>

    <div id="sub-catalog"></div>

    <div id="right-toolbar">
        <div class="icon-btn" onclick="resetCamera()" title="Сброс камеры">🏠</div>
        <div class="icon-btn" onclick="generateReport()" title="Спецификация">📋</div>
        <div class="icon-btn" onclick="export3D()" title="Скачать 3D">💾</div>
    </div>

    <div id="properties-panel">
        <h4>Редактирование модуля <span onclick="unselectModule()" style="cursor:pointer;">✕</span></h4>
        <div class="prop-grid">
            <div class="prop-group">
                <label>Ширина (мм)</label>
                <input type="number" id="prop-w" step="50" onchange="updateModuleProps()">
            </div>
            <div class="prop-group">
                <label>Высота (мм)</label>
                <input type="number" id="prop-h" step="50" onchange="updateModuleProps()">
            </div>
            <div class="prop-group">
                <label>Глубина (мм)</label>
                <input type="number" id="prop-d" step="50" onchange="updateModuleProps()">
            </div>
            <div class="prop-group">
                <label>Декор ЛДСП</label>
                <select id="prop-texture" onchange="updateModuleProps()">
                    <option value="sonoma">Дуб Сонома</option>
                    <option value="wotan">Дуб Вотан</option>
                    <option value="white_gloss">Белый глянец</option>
                    <option value="graphite">Графит</option>
                    <option value="wenge">Венге</option>
                    <option value="concrete">Бетон</option>
                </select>
            </div>
        </div>
        <div style="display:flex; gap:8px;">
            <button class="btn-action btn-door" onclick="toggleDoorAnimation()">🚪 Дверь открыть/закрыть</button>
            <button class="btn-action btn-del" onclick="deleteSelectedModule()">Удалить</button>
        </div>
    </div>

    <div id="report-modal">
        <h3 style="margin-bottom: 10px; color:#34c759;">📋 Спецификация и раскрой</h3>
        <div id="report-content"></div>
        <div style="display:flex; gap:10px;">
            <button onclick="downloadPDF()" style="padding:10px; background:#007aff; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer; flex:1;">Скачать PDF</button>
            <button onclick="closeReport()" style="padding:10px; background:#444; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer; flex:1;">Закрыть</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls;
        let modules = [];
        let selectedModule = null;

        const texturesLDSP = {
            sonoma: { color: 0xd2b59b, name: "Дуб Сонома" },
            wotan: { color: 0x8b5a2b, name: "Дуб Вотан" },
            white_gloss: { color: 0xffffff, name: "Белый глянец" },
            graphite: { color: 0x383838, name: "Графит" },
            wenge: { color: 0x3d2817, name: "Венге" },
            concrete: { color: 0x9e9e9e, name: "Бетон" }
        };

        const catalogItems = {
            base: [
                { name: "Шкаф распашной", w: 0.6, h: 0.85, d: 0.6, type: "base" },
                { name: "Шкаф с ящиками", w: 0.6, h: 0.85, d: 0.6, type: "base" },
                { name: "Шкаф под мойку", w: 0.8, h: 0.85, d: 0.6, type: "base" }
            ],
            wall: [
                { name: "Верхний шкаф", w: 0.6, h: 0.72, d: 0.35, type: "wall" },
                { name: "Шкаф горизонтальный", w: 0.8, h: 0.36, d: 0.35, type: "wall" }
            ],
            tall: [
                { name: "Пенал под технику", w: 0.6, h: 2.1, d: 0.6, type: "tall" }
            ],
            counter: [
                { name: "Столешница (3м)", w: 3.0, h: 0.04, d: 0.6, type: "countertop" }
            ]
        };

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(2.5, 2.0, 3.5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 0.8, 0);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(5, 8, 5);
            scene.add(dirLight);

            const grid = new THREE.GridHelper(8, 16, 0x555555, 0x333333);
            scene.add(grid);

            animate();
            switchTab('base', document.querySelector('.tab-btn.active'));
        }

        function switchTab(tabKey, btn) {
            if (btn) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }

            const sub = document.getElementById('sub-catalog');
            sub.innerHTML = '';
            if (!catalogItems[tabKey]) return;

            catalogItems[tabKey].forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `<b>${item.name}</b>${Math.round(item.w*1000)}×${Math.round(item.h*1000)} мм`;
                card.onclick = () => addModule(item);
                sub.appendChild(card);
            });
        }

        function createModuleMesh(item, textureKey) {
            const group = new THREE.Group();
            const w = item.w, h = item.h, d = item.d;

            const bodyGeo = new THREE.BoxGeometry(w, h, d);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = h / 2;
            group.add(body);

            const doorPivot = new THREE.Group();
            doorPivot.position.set(-w / 2, 0, d / 2);

            const tex = texturesLDSP[textureKey] || texturesLDSP.sonoma;
            const doorGeo = new THREE.BoxGeometry(w - 0.004, h - 0.004, 0.018);
            const doorMat = new THREE.MeshStandardMaterial({ color: tex.color });
            const door = new THREE.Mesh(doorGeo, doorMat);
            door.position.set(w / 2, h / 2, 0.009);
            doorPivot.add(door);
            group.add(doorPivot);

            group.userData = { ...item, textureKey, isOpen: false, doorPivot };
            return group;
        }

        function addModule(item) {
            let y = 0;
            if (item.type === 'wall') y = 1.4;
            if (item.type === 'countertop') y = 0.85;

            const mod = createModuleMesh(item, "sonoma");
            let posX = modules.length > 0 ? modules[modules.length - 1].position.x + (modules[modules.length - 1].userData.w/2) + (item.w/2) + 0.02 : -0.5;

            mod.position.set(posX, y, 0);
            scene.add(mod);
            modules.push(mod);
            selectModule(mod);
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            if (e.target.tagName !== 'CANVAS') return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            
            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && obj.parent !== scene) obj = obj.parent;
                if (modules.includes(obj)) {
                    selectModule(obj);
                    return;
                }
            }
        });

        function selectModule(mod) {
            selectedModule = mod;
            document.getElementById('properties-panel').style.display = 'block';
            document.getElementById('prop-w').value = Math.round(mod.userData.w * 1000);
            document.getElementById('prop-h').value = Math.round(mod.userData.h * 1000);
            document.getElementById('prop-d').value = Math.round(mod.userData.d * 1000);
            document.getElementById('prop-texture').value = mod.userData.textureKey;
        }

        function unselectModule() {
            selectedModule = null;
            document.getElementById('properties-panel').style.display = 'none';
        }

        function updateModuleProps() {
            if (!selectedModule) return;
            selectedModule.userData.w = parseFloat(document.getElementById('prop-w').value) / 1000;
            selectedModule.userData.h = parseFloat(document.getElementById('prop-h').value) / 1000;
            selectedModule.userData.d = parseFloat(document.getElementById('prop-d').value) / 1000;
            selectedModule.userData.textureKey = document.getElementById('prop-texture').value;

            const pos = selectedModule.position.clone();
            const u = selectedModule.userData;
            scene.remove(selectedModule);
            modules = modules.filter(m => m !== selectedModule);

            const newMod = createModuleMesh(u, u.textureKey);
            newMod.position.copy(pos);
            scene.add(newMod);
            modules.push(newMod);
            selectModule(newMod);
        }

        function toggleDoorAnimation() {
            if (!selectedModule) return;
            const pivot = selectedModule.userData.doorPivot;
            selectedModule.userData.isOpen = !selectedModule.userData.isOpen;
            pivot.rotation.y = selectedModule.userData.isOpen ? -1.8 : 0;
        }

        function deleteSelectedModule() {
            if (!selectedModule) return;
            scene.remove(selectedModule);
            modules = modules.filter(m => m !== selectedModule);
            unselectModule();
        }

        function resetCamera() {
            camera.position.set(2.5, 2.0, 3.5);
            controls.target.set(0, 0.8, 0);
        }

        function generateReport() {
            if (modules.length === 0) { alert("Добавьте шкаф в проект"); return; }
            let html = `<table class="table-spec"><tr><th>№</th><th>Шкаф</th><th>Размеры (мм)</th><th>Декор</th></tr>`;
            modules.forEach((m, i) => {
                html += `<tr><td>${i+1}</td><td>${m.userData.name}</td><td>${Math.round(m.userData.w*1000)}×${Math.round(m.userData.h*1000)}×${Math.round(m.userData.d*1000)}</td><td>${texturesLDSP[m.userData.textureKey].name}</td></tr>`;
            });
            html += `</table>`;
            document.getElementById('report-content').innerHTML = html;
            document.getElementById('report-modal').style.display = 'flex';
        }

        function closeReport() { document.getElementById('report-modal').style.display = 'none'; }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Kuhni Isfara - Specification", 14, 20);
            let y = 30;
            modules.forEach((m, i) => {
                doc.text(`${i+1}. ${m.userData.name} - ${Math.round(m.userData.w*1000)}x${Math.round(m.userData.h*1000)}x${Math.round(m.userData.d*1000)}mm`, 14, y);
                y += 10;
            });
            doc.save("Kuhni_Isfara_Project.pdf");
        }

        function export3D() {
            const exporter = new THREE.GLTFExporter();
            exporter.parse(scene, function (res) {
                const blob = new Blob([res], { type: 'application/octet-stream' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'kitchen_project.glb';
                link.click();
            }, { binary: true });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        window.addEventListener('DOMContentLoaded', init3D);
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
