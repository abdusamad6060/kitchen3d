<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Конструктор Кухонь — Кухни Исфара</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; background: #1a1a1a; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        #top-bar {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px;
            z-index: 10;
        }
        .btn {
            background: #2c2c2e; color: #fff; border: 1px solid #444;
            padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
            cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: background 0.2s;
        }
        .btn:active { background: #3a3a3c; }
        .btn-primary { background: #007aff; border-color: #007aff; }
        .btn-success { background: #34c759; border-color: #34c759; }
        .btn-warning { background: #ff9500; border-color: #ff9500; color: #000; }

        #properties-panel {
            position: absolute; bottom: 20px; left: 10px; right: 10px;
            background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px);
            border: 1px solid #444; border-radius: 12px; padding: 14px;
            display: none; z-index: 10; max-height: 45vh; overflow-y: auto;
        }
        #properties-panel h4 { margin-bottom: 8px; font-size: 15px; color: #34c759; }
        .prop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 10px; }
        .prop-group { display: flex; flex-direction: column; gap: 4px; }
        .prop-group label { font-size: 11px; color: #aaa; }
        .prop-group input, .prop-group select {
            background: #2a2a2a; border: 1px solid #555; color: #fff;
            padding: 6px; border-radius: 6px; font-size: 13px;
        }

        #report-modal {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: none; flex-direction: column; padding: 20px; z-index: 100;
        }
        #report-content { background: #222; border-radius: 12px; padding: 16px; flex: 1; overflow-y: auto; margin-bottom: 12px; font-family: monospace; font-size: 12px; line-height: 1.5; }
        .table-spec { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; }
        .table-spec th, .table-spec td { border: 1px solid #444; padding: 6px; }
        .table-spec th { background: #333; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <div id="top-bar">
        <button class="btn btn-primary" onclick="addModule('base')">➕ Нижний шкаф</button>
        <button class="btn btn-primary" onclick="addModule('wall')">➕ Верхний шкаф</button>
        <button class="btn btn-primary" onclick="addModule('tall')">➕ Пенал</button>
        <button class="btn" onclick="clearScene()">🗑️ Очистить</button>
        <button class="btn btn-success" onclick="generateReport()">📋 Спецификация</button>
        <button class="btn" onclick="export3D()">💾 3D (.glb)</button>
    </div>

    <div id="properties-panel">
        <h4 id="mod-title">Редактирование модуля</h4>
        <div class="prop-grid">
            <div class="prop-group">
                <label>Ширина (мм)</label>
                <input type="number" id="prop-w" step="50" onchange="updateSelectedModuleDimensions()">
            </div>
            <div class="prop-group">
                <label>Высота (мм)</label>
                <input type="number" id="prop-h" step="50" onchange="updateSelectedModuleDimensions()">
            </div>
            <div class="prop-group">
                <label>Глубина (мм)</label>
                <input type="number" id="prop-d" step="50" onchange="updateSelectedModuleDimensions()">
            </div>
            <div class="prop-group">
                <label>Текстура ЛДСП фасад</label>
                <select id="prop-texture" onchange="updateSelectedModuleTexture()">
                    <option value="sonoma">Дуб Сонома</option>
                    <option value="wotan">Дуб Вотан</option>
                    <option value="white_gloss">Белый глянец</option>
                    <option value="graphite">Графит матовый</option>
                    <option value="wenge">Венге темный</option>
                    <option value="concrete">Бетон светлый</option>
                </select>
            </div>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-warning" style="flex:1; justify-content:center;" onclick="toggleDoorAnimation()">🚪 Открыть/Закрыть дверь</button>
            <button class="btn" style="background:#ff3b30; border:none; flex:1; justify-content:center;" onclick="deleteSelectedModule()">Удалить</button>
        </div>
    </div>

    <div id="report-modal">
        <h3 style="margin-bottom: 10px;">📋 Спецификация и раскрой материалов</h3>
        <div id="report-content"></div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-primary" style="flex:1; justify-content:center;" onclick="downloadPDF()">Скачать PDF</button>
            <button class="btn" style="flex:1; justify-content:center;" onclick="closeReport()">Закрыть</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(2.5, 2.0, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0.8, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.65));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(5, 8, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        scene.add(new THREE.GridHelper(8, 16, 0x444444, 0x222222));

        let modules = [];
        let selectedModule = null;

        // Палитра текстур ЛДСП с реальными оттенками и шероховатостью
        const texturesLDSP = {
            sonoma: { color: 0xd2b59b, roughness: 0.6, name: "Дуб Сонома" },
            wotan: { color: 0x8b5a2b, roughness: 0.65, name: "Дуб Вотан" },
            white_gloss: { color: 0xffffff, roughness: 0.1, name: "Белый глянец" },
            graphite: { color: 0x383838, roughness: 0.4, name: "Графит матовый" },
            wenge: { color: 0x3d2817, roughness: 0.5, name: "Венге темный" },
            concrete: { color: 0x9e9e9e, roughness: 0.7, name: "Бетон светлый" }
        };

        // Создание модуля с иерархией для анимации дверей на петлях
        function createModuleMesh(w, h, d, type, textureKey) {
            const group = new THREE.Group();
            
            // Корпус шкафа
            const bodyGeo = new THREE.BoxGeometry(w, h, d);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.5 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = h / 2;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Шарнирный узел (Pivot) для двери слева (петли)
            const doorPivot = new THREE.Group();
            // Сдвигаем пивот на левый край шкафа, чтобы дверь открывалась как на петлях
            doorPivot.position.set(-w / 2, 0, d / 2);

            const texConfig = texturesLDSP[textureKey] || texturesLDSP.sonoma;
            const doorGeo = new THREE.BoxGeometry(w - 0.004, h - 0.004, 0.018);
            const doorMat = new THREE.MeshStandardMaterial({ color: texConfig.color, roughness: texConfig.roughness });
            const door = new THREE.Mesh(doorGeo, doorMat);
            
            // Смещаем сетку двери относительно пивота
            door.position.set(w / 2, h / 2, 0.009);
            door.castShadow = true;
            doorPivot.add(door);

            group.add(doorPivot);

            group.userData = {
                w: w, h: h, d: d, type: type, textureKey: textureKey,
                isOpen: false,
                doorPivot: doorPivot
            };
            return group;
        }

        function addModule(type) {
            let w = 0.6, h = 0.85, d = 0.6, y = 0;
            if (type === 'wall') { w = 0.6; h = 0.72; d = 0.35; y = 1.4; }
            if (type === 'tall') { w = 0.6; h = 2.1; d = 0.6; y = 0; }

            const mod = createModuleMesh(w, h, d, type, "sonoma");
            
            let posX = 0;
            if (modules.length > 0) {
                const last = modules[modules.length - 1];
                posX = last.position.x + (last.userData.w / 2) + (w / 2);
            } else {
                posX = -1.0;
            }
            
            mod.position.set(posX, y, 0);
            scene.add(mod);
            modules.push(mod);
            selectModule(mod);
        }

        // Выбор модуля кликом
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            if (e.target.tagName !== 'CANVAS') return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            
            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && obj.parent !== scene) {
                    obj = obj.parent;
                }
                if (modules.includes(obj)) {
                    selectModule(obj);
                    return;
                }
            }
            unselectModule();
        });

        function selectModule(mod) {
            selectedModule = mod;
            document.getElementById('properties-panel').style.display = 'block';
            document.getElementById('mod-title').innerText = `Шкаф (${Math.round(mod.userData.w*1000)} x ${Math.round(mod.userData.h*1000)} мм)`;
            document.getElementById('prop-w').value = Math.round(mod.userData.w * 1000);
            document.getElementById('prop-h').value = Math.round(mod.userData.h * 1000);
            document.getElementById('prop-d').value = Math.round(mod.userData.d * 1000);
            document.getElementById('prop-texture').value = mod.userData.textureKey;
        }

        function unselectModule() {
            selectedModule = null;
            document.getElementById('properties-panel').style.display = 'none';
        }

        // Интерактивное изменение размеров шкафа
        function updateSelectedModuleDimensions() {
            if (!selectedModule) return;
            const w = parseFloat(document.getElementById('prop-w').value) / 1000;
            const h = parseFloat(document.getElementById('prop-h').value) / 1000;
            const d = parseFloat(document.getElementById('prop-d').value) / 1000;
            
            if (w < 0.2 || h < 0.2 || d < 0.2) return;

            selectedModule.userData.w = w;
            selectedModule.userData.h = h;
            selectedModule.userData.d = d;

            rebuildSelectedModuleGeometry();
        }

        function updateSelectedModuleTexture() {
            if (!selectedModule) return;
            const textureKey = document.getElementById('prop-texture').value;
            selectedModule.userData.textureKey = textureKey;
            rebuildSelectedModuleGeometry();
        }

        function rebuildSelectedModuleGeometry() {
            const posX = selectedModule.position.x;
            const posY = selectedModule.position.y;
            const posZ = selectedModule.position.z;
            const u = selectedModule.userData;

            scene.remove(selectedModule);
            modules = modules.filter(m => m !== selectedModule);

            const newMod = createModuleMesh(u.w, u.h, u.d, u.type, u.textureKey);
            newMod.position.set(posX, posY, posZ);
            newMod.userData.isOpen = u.isOpen;
            if (u.isOpen) {
                newMod.userData.doorPivot.rotation.y = -Math.PI / 1.8;
            }

            scene.add(newMod);
            modules.push(newMod);
            selectModule(newMod);
        }

        // Плавная анимация открывания/закрывания дверей
        let animatingDoors = [];
        function toggleDoorAnimation() {
            if (!selectedModule) return;
            const pivot = selectedModule.userData.doorPivot;
            const targetRotation = selectedModule.userData.isOpen ? 0 : -Math.PI / 1.8;
            selectedModule.userData.isOpen = !selectedModule.userData.isOpen;

            animatingDoors.push({
                pivot: pivot,
                start: pivot.rotation.y,
                end: targetRotation,
                progress: 0
            });
        }

        function deleteSelectedModule() {
            if (!selectedModule) return;
            scene.remove(selectedModule);
            modules = modules.filter(m => m !== selectedModule);
            unselectModule();
        }

        function clearScene() {
            modules.forEach(m => scene.remove(m));
            modules = [];
            unselectModule();
        }

        function generateReport() {
            if (modules.length === 0) {
                alert("Сначала добавьте модули в проект.");
                return;
            }

            let html = `<h4>СПЕЦИФИКАЦИЯ И РАСКРОЙ (Кухни Исфара)</h4>`;
            html += `<table class="table-spec">
                <tr><th>№</th><th>Тип</th><th>Размеры (мм)</th><th>Текстура фасад</th><th>Детали корпуса и фасада</th></tr>`;

            modules.forEach((m, idx) => {
                const W = Math.round(m.userData.w * 1000);
                const H = Math.round(m.userData.h * 1000);
                const D = Math.round(m.userData.d * 1000);
                const texName = texturesLDSP[m.userData.textureKey].name;

                html += `<tr>
                    <td>${idx+1}</td>
                    <td><b>${m.userData.type}</b></td>
                    <td>${W}x${H}x${D}</td>
                    <td>${texName}</td>
                    <td>Боковины: 2шт (${H}x${D}), Полки/Дно: 2шт (${W-32}x${D}), Фасад: 1шт (${H-4}x${W-4})</td>
                </tr>`;
            });
            html += `</table>`;
            document.getElementById('report-content').innerHTML = html;
            document.getElementById('report-modal').style.display = 'flex';
        }

        function closeReport() { document.getElementById('report-modal').style.display = 'none'; }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Kuhni Isfara - 3D Project Report", 10, 15);
            let y = 25;
            modules.forEach((m, i) => {
                doc.text(`${i+1}. Модуль: ${Math.round(m.userData.w*1000)}x${Math.round(m.userData.h*1000)}мм (${m.userData.type})`, 10, y);
                y += 10;
            });
            doc.save("Kuhni_Isfara_Project.pdf");
        }

        function export3D() {
            const exporter = new THREE.GLTFExporter();
            exporter.parse(scene, function (result) {
                const blob = new Blob([result], { type: 'application/octet-stream' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'kitchen_design.glb';
                link.click();
            }, { binary: true });
        }

        function animate() {
            requestAnimationFrame(animate);

            // Обработка плавного открытия дверей
            if (animatingDoors.length > 0) {
                animatingDoors.forEach(anim => {
                    anim.progress += 0.1;
                    anim.pivot.rotation.y = THREE.MathUtils.lerp(anim.pivot.rotation.y, anim.end, 0.2);
                });
                animatingDoors = animatingDoors.filter(anim => Math.abs(anim.pivot.rotation.y - anim.end) > 0.01);
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
